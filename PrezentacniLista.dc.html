      hasGroup5: !!src5, label5: P.label5 || '', items5,
      hasGroup6: !!src6, label6: P.label6 || '', items6,
      tg1: P.noGroup1 ? { is:false, not:false } : this.tg(src, active, onSelect, P.label || 'Kategorie:'),
      tg2: this.tg(src2, active2, onSelect2, P.label2), tg3: this.tg(src3, active3, onSelect3, P.label3),
      tg4: this.tg(src4, active4, onSelect4, P.label4), tg5: this.tg(src5, active5, onSelect5, P.label5),
      tg6: this.tg(src6, active6, onSelect6, P.label6),
      ...(()=>{ const x = this.fade(this.state.open === true); return { open: x.mounted, shown: x.shown }; })(),
      expanded: this.state.open ? 'true' : 'false',
      fabIcon: this.state.open ? 'x' : 'adjustments-horizontal',
      fabAria: this.state.open ? 'Zavřít nabídku variant' : 'Otevřít nabídku variant',
      rootRef: this.rootRef,
      onToggleOpen: ()=>this.setState(s=>({ open: !s.open })),
      onClose: ()=>this.setState({ open:false }),
    };
  }
}
</script>
</body>
</html>
